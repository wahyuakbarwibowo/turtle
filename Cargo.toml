[workspace]
resolver = "3"
members = ["apps/server", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
common = { path = "crates/common" }
database = { path = "crates/database" }
livekit-client = { path = "crates/livekit-client" }
telemetry = { path = "crates/telemetry" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
